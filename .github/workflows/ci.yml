name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the code. No secrets are needed — tests mock
# Gemini, email, WhatsApp and Redis.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobagent
          POSTGRES_PASSWORD: jobagent
          POSTGRES_DB: jobagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobagent -d jobagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tests TRUNCATE every table; conftest refuses a DB name without "test".
      TEST_DATABASE_URL: postgresql+psycopg://jobagent:jobagent@localhost:5432/jobagent_test
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as deploy/Dockerfile.api
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Chromium (auto-apply end-to-end test)
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider

  apply-agent:
    name: Apply-agent tests (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/apply-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workers/apply-agent/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.2.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider

  web:
    name: Web type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build deploy/Dockerfile.api (what Railway deploys)
        run: docker build -f deploy/Dockerfile.api -t jobagent-api:ci .
      - name: Smoke-test the image
        run: >-
          docker run --rm --entrypoint python jobagent-api:ci -c
          "import app.main, app.tasks.auto_apply, app.tasks.job_scanner, apply_agent, job_scanner; print('imports ok')"
