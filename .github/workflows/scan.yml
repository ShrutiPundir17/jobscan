name: Job scan

# Scrapes the job portals and embeds new jobs when the API runs without a
# background worker (Render free, TASK_MODE=inline). Needs repo secrets:
# DATABASE_URL (Supabase session pooler), REDIS_URL (Upstash), GOOGLE_API_KEY.
on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours, off the busy top of the hour
  workflow_dispatch:  # "Scan jobs" in the app (via GITHUB_DISPATCH_TOKEN) or manual run
    inputs:
      keywords:
        description: Comma-separated roles (blank = from users' preferences)
        required: false
        default: ""
      locations:
        description: Comma-separated cities (blank = from users' preferences)
        required: false
        default: ""

permissions:
  contents: read

# Never run two scans at once; queue instead of cancelling a scan midway.
concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'ShrutiPundir17/jobscan'  # forks don't scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SCANNER_PROXY_URL: ${{ secrets.SCANNER_PROXY_URL }}
      TASK_MODE: inline
      SCANNER_ENABLED: "true"
      SCANNER_HEADLESS: "true"
      # User-typed text: only ever passed through env vars, never interpolated
      # into the shell script (prevents command injection).
      SCAN_KEYWORDS: ${{ inputs.keywords }}
      SCAN_LOCATIONS: ${{ inputs.locations }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$REDIS_URL" ]; then
            echo "::warning::DATABASE_URL / REDIS_URL secrets are not set — skipping the scan."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: |
          pip install -r apps/api/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scan portals and embed new jobs
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/workers/job-scanner:${{ github.workspace }}/workers/apply-agent:${{ github.workspace }}/apps/api
        run: python -m app.scan_once --keywords "$SCAN_KEYWORDS" --locations "$SCAN_LOCATIONS"
