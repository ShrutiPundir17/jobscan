# Railway: deploy from repo root with this Dockerfile.
# Create separate services for api / celery-worker / celery-beat (same image, different SERVICE_ROLE).
# Do not set a global HTTP healthcheck here — Celery services are not HTTP servers.
# Enable /health check only on the `api` service in the Railway dashboard if desired.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile.api"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
